name: DevOs checks

on:
  push:
    branches: [main, ux3407na-dev]
  pull_request:
    branches: [main, ux3407na-dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # DevLang `d` runs the system helpers' tests. The checksums below pin v0.5.5 (same as the tag-triggered Publish workflow).
  DEVLANG_VERSION: v0.5.5

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux build and test dependencies
        # Xvfb provides a display for GTK UI tests; the native window
        # tracker needs the Wayland headers, and the lock-screen test needs the pinned swaylock.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwayland-dev libwayland-bin gjs \
            gir1.2-gtk-3.0 gir1.2-gtklayershell-0.1 gir1.2-vte-2.91 \
            gir1.2-webkit2-4.1 gir1.2-soup-3.0 curl python3-gi gir1.2-nm-1.0 python3-yaml xvfb xauth
          sudo sh tools/setup/bootstrap-lock.sh
          sudo chown -R "$(id -u):$(id -g)" build
      - name: Install pinned DevLang ${{ env.DEVLANG_VERSION }}
        run: |
          machine=$(uname -m)
          case "$machine" in
            aarch64) arch=arm64; checksum=2a3bf7c5505f4125f778cf5ab8ef346a2a9535f4b1714bb80aa3177ced1d7e32 ;;
            x86_64) arch=x86_64; checksum=060d3c3b6d5030637930fee2f018611c7d3747fab1c13bd65446d7c733219659 ;;
            *) exit 1 ;;
          esac
          archive="devlang-d-$DEVLANG_VERSION-linux-$arch.tar.gz"
          curl --fail --location --output "$RUNNER_TEMP/$archive" "https://github.com/d-osc/DevLang/releases/download/$DEVLANG_VERSION/$archive"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/devlang-d-$DEVLANG_VERSION-linux-$arch" >> "$GITHUB_PATH"
      - name: Install npm dependencies
        run: npm ci
      - name: Check DevLang models and preserved npm APIs
        run: |
          d tests/session-model.test.dev
          d tests/theme-palette-devlang.test.dev
          d tests/migration-compat.test.dev
          d tests/no-gjs-audit.test.dev
          d tests/splash-native.test.dev
          d tests/greeter-native.test.dev
          d tests/background-domain.test.dev
          d tests/background-cleanup.test.dev
          d tests/background-widget-service.test.dev
          d tests/background-settings.test.dev
          d tests/panel-power-native.test.dev
          d tests/panel-devices-native.test.dev
          d tests/panel-device-actions-native.test.dev
          d tests/panel-menu-model.test.dev
          d tests/panel-layout-native.test.dev
          d tests/panel-taskbar-native.test.dev
          d tests/display-care-shell.test.dev
          d tests/system-displaycare-native.test.dev
          d tools/maintenance/migration-audit.dev
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Native session lifecycle and JS supervisor binding
        run: |
          d tests/supervisor-native.test.dev
          d tests/shell-command-native.test.dev
          d tests/background-actions.test.dev
          d tools/test/splash-native-smoke.dev
          d tests/login-native.test.dev
          d tests/background-render-native.test.dev
          d tests/background-ui-native.test.dev
          d tests/background-picture-native.test.dev
          d tests/background-theme-native.test.dev
          d tests/background-preferences-native.test.dev
          d tests/background-shell-native.test.dev
          d tests/background-settings-native.test.dev
          d tools/test/background-layer-smoke.dev
          d tools/test/background-widgets-smoke.dev
          d tools/test/background-shell-smoke.dev
          d tools/test/background-settings-smoke.dev
          d tools/test/background-settings-production-smoke.dev
          d tools/test/panel-power-smoke.dev
          d tools/test/panel-layout-smoke.dev
          d tools/test/panel-session-power-smoke.dev
          d tools/test/panel-runtime-smoke.dev
          d tools/test/panel-settings-production-smoke.dev
          d tests/panel-taskbar-render-native.test.dev
          d tests/panel-taskbar-catalog.test.dev
          d tests/panel-clock-native.test.dev
          d tests/panel-alerts-native.test.dev
          d tests/panel-session-power-native.test.dev
          d tests/panel-accounts-native.test.dev
          d tests/panel-settings-native.test.dev
          d tests/system-panel-native.test.dev
          d tests/panel-command-native.test.dev
          d tests/panel-tray-native.test.dev
          d tests/panel-battery-care-native.test.dev
          d tools/test/background-menu-smoke.dev -- panel top
          d tools/test/background-menu-smoke.dev -- panel bottom
          sh tools/build/native-background-runtime.sh
          d tools/test/background-runtime-smoke.dev
      - name: Python tests
        run: /usr/bin/python3 tools/release/run_python_tests.py
