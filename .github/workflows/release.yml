name: Publish Dev OS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example, v0.3.7); reads docs/releases/<version>.md'
        required: true
        default: v0.3.7-ux3407na-dev
        type: string
      build_image:
        description: Build and publish the Live USB image (requires the ARM64 image runner)
        default: false
        type: boolean
      build_system_bundle:
        description: Build and publish the system update for Settings > Updates (requires the ARM64 image runner)
        default: false
        type: boolean
      image_runner:
        description: ARM64 image runner labels (JSON array)
        default: '["self-hosted","linux","ARM64","devos-image"]'
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    uses: ./.github/workflows/release-manual.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      build_image: ${{ inputs.build_image == true || (github.event_name == 'push' && vars.DEVOS_RELEASE_IMAGE == 'true') }}
      build_system_bundle: ${{ inputs.build_system_bundle == true || (github.event_name == 'push' && vars.DEVOS_RELEASE_SYSTEM_BUNDLE == 'true') }}
      image_runner: ${{ inputs.image_runner || vars.DEVOS_IMAGE_RUNNER || '["self-hosted","linux","ARM64","devos-image"]' }}
    secrets: inherit
