DISTRO = "devos"
DISTRO_NAME = "DevOs"
DISTRO_VERSION = "0.1"
DISTRO_CODENAME = "independent"
MAINTAINER = "DevOs"
TARGET_VENDOR = "-devos"
PREFERRED_PROVIDER_virtual/kernel = "linux-devos"
TCLIBC = "glibc"
INIT_MANAGER = "systemd"
PACKAGE_CLASSES = "package_ipk"
# Vendor Chromium/Electron binaries link X11 client libraries even when using
# native Wayland. This enables those libraries, not an X server or X session.
DISTRO_FEATURES = "acl alsa bluetooth ipv4 ipv6 pam pci polkit pulseaudio seccomp usbhost usbgadget wifi xattr wayland x11 opengl gobject-introspection-data largefile"
DISTRO_FEATURES_OPTED_OUT = "sysvinit"
VIRTUAL-RUNTIME_base-utils = "busybox"
VIRTUAL-RUNTIME_base-utils-hwclock = "busybox-hwclock"
VIRTUAL-RUNTIME_base-utils-syslog = ""
VIRTUAL-RUNTIME_base-utils-dev = ""
VIRTUAL-RUNTIME_login_manager = "shadow-base"
PACKAGECONFIG:append:pn-networkmanager = " nmcli wifi bluez5 polkit"
# webkitgtk3 2.50 uses libsoup 3 directly (USE_SOUP2=OFF); soup3 is not an option.
PACKAGECONFIG:append:pn-webkitgtk3 = " wayland"
PACKAGECONFIG:remove:pn-vte = "gtk4"
PACKAGECONFIG:remove:pn-wireplumber = "systemd-system-service"
PACKAGECONFIG:remove:pn-pipewire = "systemd-system-service"
RRECOMMENDS:pn-labwc = ""
SYSTEMD_DEFAULT_TARGET = "graphical.target"
hostname:pn-base-files = "devos"
PACKAGECONFIG:append:pn-systemd = " timedated timesyncd"
IMAGE_LINGUAS = "en-us"
INHERIT += "buildhistory"
BUILDHISTORY_COMMIT = "0"

# Native app-store package downloads and signed index verification.
PACKAGECONFIG:append:pn-opkg = " gpg curl ssl-curl sha256"
