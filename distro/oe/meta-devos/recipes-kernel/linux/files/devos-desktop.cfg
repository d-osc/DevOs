# Desktop requirements layered over DevOsLinuxKernel's actual ARM64 config.
CONFIG_LOCALVERSION="-devos"
CONFIG_LOCALVERSION_AUTO=n
CONFIG_MODULES=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_CGROUPS=y
CONFIG_MEMCG=y
CONFIG_SWAP=y
CONFIG_ZSMALLOC=y
CONFIG_ZRAM=m
CONFIG_ZRAM_BACKEND_LZ4=y
CONFIG_ZRAM_BACKEND_ZSTD=y
CONFIG_CRYPTO_ZSTD=y
CONFIG_ADVISE_SYSCALLS=y
CONFIG_CGROUP_PIDS=y
CONFIG_NAMESPACES=y
CONFIG_FHANDLE=y
CONFIG_INOTIFY_USER=y
CONFIG_SIGNALFD=y
CONFIG_TIMERFD=y
CONFIG_EPOLL=y
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
CONFIG_UNIX=y
CONFIG_UNIX98_PTYS=y
CONFIG_INPUT_EVDEV=y
CONFIG_VIRTIO_INPUT=y
CONFIG_DRM=y
CONFIG_DRM_VIRTIO_GPU=y
CONFIG_DRM_BOCHS=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_VIRTIO_MMIO=y
CONFIG_VIRTIO_BLK=y
CONFIG_VIRTIO_NET=y
CONFIG_EXT4_FS=y
CONFIG_EXT4_FS_POSIX_ACL=y
CONFIG_AUTOFS_FS=y
# USB cameras (V4L2/UVC) and microphone/audio capture.
CONFIG_USB=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_PLATFORM=y
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_VIDEO_DEV=y
CONFIG_USB_VIDEO_CLASS=m
CONFIG_SND=y
CONFIG_SND_PCM=y
CONFIG_SND_USB_AUDIO=m
CONFIG_SND_HDA_INTEL=m
CONFIG_SND_VIRTIO=m
# TaskFirst (Settings > Network & Internet > Connectivity): priority queue + fq_codel + flower classifier, egress only.
CONFIG_NET_SCHED=y
CONFIG_NET_SCH_PRIO=m
CONFIG_NET_SCH_FQ_CODEL=m
CONFIG_NET_CLS=y
CONFIG_NET_CLS_FLOWER=m
