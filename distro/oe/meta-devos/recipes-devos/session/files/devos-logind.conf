# Sleep when the lid closes, on battery or external power; stay awake when docked.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
# A short press of the power key sleeps instead of powering off (hold or use the panel to shut down).
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
# Give the shell time to lock the screen before the system sleeps.
InhibitDelayMaxSec=5
