# Suspend to RAM only: the lowest sleep power that wakes in about a second.
# Hibernation and suspend-then-hibernate would deep-sleep later but resume from disk, so they stay off.
[Sleep]
AllowSuspend=yes
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
SuspendState=mem
# Prefer firmware "deep" (S3/PSCI: only RAM stays powered); fall back to s2idle where deep is not offered.
MemorySleepMode=deep s2idle
