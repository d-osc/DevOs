# DevOs memory tuning (the swap size, algorithm and swappiness are applied by devos-zram.service from /etc/devos/swap.conf).
# Swap lives in compressed RAM, so reading it back is cheap: prefer it to dropping page cache and fetch one page at a time.
vm.swappiness = 100
vm.page-cluster = 0
# Keep dentries and inodes a little longer; the file-manager and launcher walk the same trees repeatedly.
vm.vfs_cache_pressure = 50
# No temporary watermark boost after fragmentation (it makes the kernel reclaim aggressively and stutters the desktop),
# but start background reclaim earlier so applications rarely stall in direct reclaim.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# A USB stick is slow: cap dirty data in absolute terms (a percentage of 16 GB of RAM lets seconds of writeback pile up and
# then freezes every program that touches the disk).
vm.dirty_background_bytes = 33554432
vm.dirty_bytes = 134217728
