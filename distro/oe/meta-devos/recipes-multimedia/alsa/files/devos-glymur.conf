Syntax 4

# The short DT sound-card name is stable. ASoC replaces CardLongName with a
# cleaned DMI identity on the real ASUS, so it cannot be matched to the DT model.
# Keep the upstream DMI selection for other Glymur machines.
If.DevOsAsusCard {
    Condition {
        Type RegexMatch
        String "${CardName}"
        Regex "^GLYMUR-ASUS-Zenbook-A14-UX3407N"
    }
    True.Include.asus.File "/Qualcomm/glymur/ASUS-Zenbook-A14-UX3407NA.conf"
    False.Include.upstream.File "/Qualcomm/glymur/glymur-upstream.conf"
}
